<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#eaffff">
    <circle cx="80" cy="90" r="3" opacity="0.8"/>
    <circle cx="430" cy="70" r="2" opacity="0.6"/>
    <circle cx="460" cy="200" r="2.5" opacity="0.7"/>
    <circle cx="60" cy="300" r="2" opacity="0.5"/>
    <circle cx="120" cy="440" r="2.5" opacity="0.6"/>
    <circle cx="420" cy="430" r="3" opacity="0.7"/>
    <circle cx="380" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="150" cy="60" r="1.5" opacity="0.5"/>
  </g>

  <g transform="rotate(-18 256 246)">
    <!-- cabo umbilical solto (à deriva) -->
    <path d="M310 300 C 370 330, 400 300, 430 350 C 445 375, 430 400, 410 405"
          fill="none" stroke="url(#pink)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="0.1 20" filter="url(#glow)"/>

    <!-- mochila -->
    <rect x="196" y="192" width="120" height="124" rx="26" fill="#0e2a3a" stroke="#00ffff" stroke-width="5"/>
    <!-- antena + transmissão -->
    <line x1="308" y1="198" x2="334" y2="150" stroke="#00ffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="336" cy="144" r="8" fill="url(#pink)" filter="url(#glow)"/>
    <g fill="none" stroke="url(#pink)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
      <path d="M317 111 A38 38 0 0 1 369 125"/>
      <path d="M308 83 A68 68 0 0 1 396 107"/>
    </g>

    <!-- pernas -->
    <g fill="none" stroke="#e8f4ff" stroke-width="30" stroke-linecap="round">
      <path d="M238 292 C 232 330, 220 350, 198 374"/>
      <path d="M276 292 C 286 326, 306 336, 330 348"/>
    </g>
    <circle cx="194" cy="382" r="19" fill="url(#pink)"/>
    <circle cx="338" cy="352" r="19" fill="url(#pink)"/>

    <!-- braços -->
    <g fill="none" stroke="#e8f4ff" stroke-width="27" stroke-linecap="round">
      <path d="M224 216 C 192 202, 174 178, 164 150"/>
      <path d="M292 222 C 320 238, 334 262, 342 288"/>
    </g>
    <circle cx="160" cy="142" r="17" fill="url(#pink)"/>
    <circle cx="346" cy="294" r="17" fill="url(#pink)"/>

    <!-- torso -->
    <rect x="214" y="196" width="88" height="104" rx="26" fill="#edf6ff"/>
    <rect x="238" y="226" width="40" height="28" rx="6" fill="#071726" stroke="#00ffff" stroke-width="3.5"/>
    <circle cx="248" cy="240" r="3.5" fill="#ff00cc"/>
    <circle cx="262" cy="240" r="3.5" fill="#00ffff"/>

    <!-- capacete -->
    <circle cx="258" cy="140" r="62" fill="#edf6ff"/>
    <rect x="214" y="112" width="88" height="60" rx="30" fill="#04101e" stroke="url(#cm)" stroke-width="5"/>
    <path d="M230 136 Q 244 120, 264 117" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
