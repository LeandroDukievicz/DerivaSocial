<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#120a28"/>
      <stop offset="1" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a3d"/>
      <stop offset="1" stop-color="#0a0416"/>
    </linearGradient>
    <clipPath id="visorClip">
      <rect x="186" y="212" width="140" height="86" rx="36"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#eaffff">
    <circle cx="90" cy="110" r="2.5" opacity="0.7"/>
    <circle cx="420" cy="90" r="2" opacity="0.6"/>
    <circle cx="450" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="70" cy="360" r="2" opacity="0.5"/>
    <circle cx="150" cy="460" r="2" opacity="0.6"/>
    <circle cx="370" cy="450" r="2.5" opacity="0.7"/>
  </g>

  <!-- ondas de transmissão -->
  <g fill="none" stroke="url(#pink)" stroke-width="13" stroke-linecap="round" filter="url(#glow)">
    <path d="M226 132 A42 42 0 0 1 286 132"/>
    <path d="M206 111 A70 70 0 0 1 306 111"/>
    <path d="M186 90 A99 99 0 0 1 326 90"/>
  </g>
  <circle cx="256" cy="160" r="10" fill="url(#pink)" filter="url(#glow)"/>

  <!-- eco RGB (glitch) do capacete -->
  <path d="M148 292 V272 A100 100 0 1 1 348 272 V292 Q348 332 308 332 H188 Q148 332 148 292 Z"
        fill="none" stroke="#00ffff" stroke-width="8" opacity="0.5"/>
  <path d="M164 292 V272 A100 100 0 1 1 364 272 V292 Q364 332 324 332 H204 Q164 332 164 292 Z"
        fill="none" stroke="#ff00cc" stroke-width="8" opacity="0.5"/>

  <!-- barras de glitch -->
  <rect x="108" y="240" width="76" height="14" fill="#00ffff" opacity="0.55"/>
  <rect x="330" y="264" width="80" height="14" fill="#ff00cc" opacity="0.55"/>

  <!-- capacete -->
  <path d="M156 292 V272 A100 100 0 1 1 356 272 V292 Q356 332 316 332 H196 Q156 332 156 292 Z"
        fill="#edf6ff"/>

  <!-- visor synthwave -->
  <rect x="186" y="212" width="140" height="86" rx="36" fill="url(#visor)" stroke="url(#cm)" stroke-width="7"/>
  <g clip-path="url(#visorClip)" fill="url(#pink)" filter="url(#glow)">
    <rect x="186" y="252" width="140" height="5" opacity="0.9"/>
    <rect x="186" y="266" width="140" height="6" opacity="0.75"/>
    <rect x="186" y="281" width="140" height="8" opacity="0.6"/>
  </g>
  <path d="M206 240 Q 222 222, 246 219" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- colar -->
  <rect x="196" y="332" width="120" height="22" rx="11" fill="none" stroke="url(#cm)" stroke-width="7" filter="url(#glow)"/>

  <!-- traços de circuito -->
  <g fill="none" stroke="#00ffff" stroke-width="4" opacity="0.28">
    <path d="M60 430 H130 L160 400 H210"/>
    <path d="M452 430 H382 L352 400 H302"/>
  </g>
  <g fill="#00ffff" opacity="0.4">
    <circle cx="60" cy="430" r="5"/>
    <circle cx="452" cy="430" r="5"/>
  </g>
</svg>
