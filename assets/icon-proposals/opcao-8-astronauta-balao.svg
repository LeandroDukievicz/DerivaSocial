<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#eaffff">
    <circle cx="440" cy="300" r="2.5" opacity="0.7"/>
    <circle cx="390" cy="420" r="2" opacity="0.6"/>
    <circle cx="70" cy="200" r="2" opacity="0.6"/>
    <circle cx="180" cy="120" r="2" opacity="0.5"/>
    <circle cx="240" cy="60" r="2.5" opacity="0.7"/>
    <circle cx="460" cy="450" r="2" opacity="0.5"/>
  </g>

  <!-- planeta com anel -->
  <g filter="url(#glow)">
    <circle cx="96" cy="92" r="24" fill="#0e2a3a" stroke="#00ffff" stroke-width="5"/>
    <ellipse cx="96" cy="92" rx="42" ry="13" fill="none" stroke="url(#pink)" stroke-width="5" transform="rotate(-18 96 92)"/>
  </g>

  <!-- astronauta (busto, canto inferior esquerdo) -->
  <g transform="rotate(-8 210 400)">
    <rect x="118" y="330" width="184" height="170" rx="42" fill="#edf6ff"/>
    <rect x="176" y="368" width="52" height="36" rx="8" fill="#071726" stroke="#00ffff" stroke-width="4"/>
    <circle cx="190" cy="386" r="4" fill="#ff00cc"/>
    <circle cx="208" cy="386" r="4" fill="#00ffff"/>
    <circle cx="210" cy="272" r="80" fill="#edf6ff"/>
    <rect x="154" y="236" width="112" height="78" rx="36" fill="#04101e" stroke="url(#cm)" stroke-width="6"/>
    <path d="M176 262 Q 192 242, 216 238" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="284" y1="240" x2="314" y2="206" stroke="#00ffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="318" cy="200" r="8" fill="url(#pink)" filter="url(#glow)"/>
  </g>

  <!-- braço acenando em direção ao balão -->
  <path d="M296 372 C 332 348, 348 322, 356 296" fill="none" stroke="#e8f4ff" stroke-width="29" stroke-linecap="round"/>
  <circle cx="360" cy="288" r="18" fill="url(#pink)"/>

  <!-- balão de fala com rede -->
  <path d="M304 96 H418 Q452 96 452 130 V178 Q452 212 418 212 H352 L300 254 L318 212 H304 Q270 212 270 178 V130 Q270 96 304 96 Z"
        fill="rgba(0,255,255,0.05)" stroke="url(#cm)" stroke-width="11" stroke-linejoin="round" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <line x1="322" y1="156" x2="392" y2="126" stroke="#00ffff" stroke-width="6"/>
    <line x1="322" y1="156" x2="392" y2="184" stroke="#00ffff" stroke-width="6"/>
    <circle cx="322" cy="156" r="11" fill="url(#pink)"/>
    <circle cx="392" cy="126" r="11" fill="url(#pink)"/>
    <circle cx="392" cy="184" r="11" fill="url(#pink)"/>
  </g>
</svg>
