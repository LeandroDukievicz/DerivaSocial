<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010212"/>
      <stop offset="1" stop-color="#081A3A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#6CF2FF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#6CF2FF" opacity="0.5">
    <circle cx="392" cy="110" r="3"/>
    <circle cx="430" cy="230" r="2.5"/>
    <circle cx="96" cy="330" r="2"/>
    <circle cx="360" cy="330" r="2"/>
  </g>

  <!-- bolhas subindo do gargalo -->
  <g fill="#00ffff" opacity="0.65" filter="url(#glow)">
    <circle cx="152" cy="98" r="5"/>
    <circle cx="126" cy="72" r="7"/>
    <circle cx="174" cy="58" r="4"/>
  </g>

  <!-- garrafa à deriva -->
  <g transform="rotate(-26 256 236)" filter="url(#glow)">
    <rect x="230" y="88" width="52" height="34" rx="8" fill="url(#pink)"/>
    <path d="M236 126 L236 176 Q206 196 206 238 L206 348 Q206 392 250 392 L262 392 Q306 392 306 348 L306 238 Q306 196 276 176 L276 126 Z"
          fill="rgba(0,255,255,0.07)" stroke="url(#cyan)" stroke-width="11" stroke-linejoin="round"/>
    <!-- mensagem: papel com </> -->
    <g transform="rotate(4 256 282)">
      <rect x="226" y="236" width="60" height="92" rx="6" fill="#eaffff"/>
      <g fill="none" stroke="url(#pink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="248,262 236,282 248,302"/>
        <line x1="262" y1="258" x2="250" y2="306"/>
        <polyline points="264,262 276,282 264,302"/>
      </g>
    </g>
  </g>

  <!-- água -->
  <path d="M88 420 Q112 404 136 420 T184 420 T232 420 T280 420 T328 420 T376 420 T424 420"
        fill="none" stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M140 456 Q164 444 188 456 T236 456 T284 456 T332 456 T372 456"
        fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
</svg>
