<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#120a28"/>
      <stop offset="1" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#eaffff">
    <circle cx="256" cy="52" r="2" opacity="0.6"/>
    <circle cx="120" cy="105" r="2.5" opacity="0.7"/>
    <circle cx="400" cy="100" r="2" opacity="0.6"/>
    <circle cx="90" cy="400" r="2" opacity="0.5"/>
    <circle cx="430" cy="390" r="2.5" opacity="0.6"/>
  </g>

  <!-- traços de circuito -->
  <g fill="none" stroke="#00ffff" stroke-width="4" opacity="0.28">
    <path d="M36 140 H76 L106 110 H140"/>
    <path d="M476 372 H436 L406 402 H372"/>
  </g>
  <g fill="#00ffff" opacity="0.4">
    <circle cx="36" cy="140" r="5"/>
    <circle cx="476" cy="372" r="5"/>
  </g>

  <!-- moldura octogonal neon -->
  <path d="M446 335 L335 446 L177 446 L66 335 L66 177 L177 66 L335 66 L446 177 Z"
        fill="none" stroke="url(#cm)" stroke-width="13" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- capacete -->
  <circle cx="256" cy="240" r="110" fill="#0a1626" stroke="#edf6ff" stroke-width="12"/>
  <path d="M180 172 A104 104 0 0 1 300 150" fill="none" stroke="#eaffff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- antena -->
  <line x1="356" y1="204" x2="390" y2="168" stroke="#00ffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="394" cy="162" r="9" fill="url(#pink)" filter="url(#glow)"/>
  <!-- colar -->
  <rect x="206" y="342" width="100" height="22" rx="11" fill="#123048" stroke="#00ffff" stroke-width="4"/>

  <!-- visor com ícone de compartilhar -->
  <rect x="176" y="196" width="160" height="110" rx="48" fill="#030b16" stroke="url(#cm)" stroke-width="8"/>
  <g filter="url(#glow)">
    <line x1="216" y1="251" x2="283" y2="219" stroke="#00ffff" stroke-width="7"/>
    <line x1="216" y1="251" x2="283" y2="283" stroke="#00ffff" stroke-width="7"/>
    <circle cx="216" cy="251" r="13" fill="url(#pink)"/>
    <circle cx="283" cy="219" r="13" fill="url(#pink)"/>
    <circle cx="283" cy="283" r="13" fill="url(#pink)"/>
  </g>
</svg>
