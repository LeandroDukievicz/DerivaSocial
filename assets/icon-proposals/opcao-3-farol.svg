<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010212"/>
      <stop offset="1" stop-color="#081A3A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#6CF2FF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff00cc"/>
      <stop offset="1" stop-color="#FF4AC4"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="torre">
      <path d="M224 212 L288 212 L306 396 L206 396 Z"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#6CF2FF" opacity="0.5">
    <circle cx="110" cy="80" r="3"/>
    <circle cx="404" cy="66" r="2.5"/>
    <circle cx="448" cy="280" r="2"/>
    <circle cx="66" cy="300" r="2"/>
  </g>

  <!-- feixes de luz alcançando os nós (as redes) -->
  <polygon points="224,182 48,116 48,214" fill="url(#beamL)"/>
  <polygon points="288,182 464,116 464,214" fill="url(#beamR)"/>
  <g fill="url(#pink)" filter="url(#glow)">
    <circle cx="74" cy="142" r="9"/>
    <circle cx="74" cy="192" r="9"/>
    <circle cx="438" cy="142" r="9"/>
    <circle cx="438" cy="192" r="9"/>
  </g>

  <!-- farol -->
  <g filter="url(#glow)">
    <rect x="222" y="172" width="68" height="40" fill="url(#cyan)"/>
    <path d="M212 172 L300 172 L256 126 Z" fill="url(#pink)"/>
    <circle cx="256" cy="120" r="7" fill="url(#pink)"/>
    <path d="M224 212 L288 212 L306 396 L206 396 Z" fill="#eaffff"/>
    <g clip-path="url(#torre)" fill="url(#pink)">
      <rect x="200" y="252" width="112" height="30"/>
      <rect x="200" y="318" width="112" height="30"/>
    </g>
    <rect x="192" y="396" width="128" height="22" rx="8" fill="url(#cyan)"/>
  </g>

  <!-- água -->
  <path d="M56 452 Q80 436 104 452 T152 452 T200 452 T248 452 T296 452 T344 452 T392 452 T440 452"
        fill="none" stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
</svg>
